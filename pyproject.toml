[project]
name = "microstructx"
version = "0.1.0"
description = "Adaptive multi-agent market microstructure backtesting engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
    "numba>=0.58",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
dashboard = [
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.scripts]
microstructx-demo = "microstructx.cli:main"
microstructx-dashboard = "microstructx.dashboard:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
